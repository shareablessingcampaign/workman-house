name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Package the web app
        run: node scripts/build-www.js

      - name: Create the Android project
        run: npx cap add android

      - name: Add Bluetooth plugin, permissions and icon
        run: |
          node scripts/patch-android.js
          bash scripts/make-icons.sh

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WorkmanChat.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkmanChat-apk
          path: WorkmanChat.apk

      - name: Publish APK to Releases (so the in-app Download button works)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Workman Chat build ${{ github.run_number }}
          files: WorkmanChat.apk
          make_latest: true
